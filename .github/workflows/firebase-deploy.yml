name: AFGlion Firebase Deploy
on:
  push:
    branches: [afglion-backend-final]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: afglion-47b07
      FIREBASE_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFGLION_47B07 }}
      FIREBASE_SA_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TOKEN_SECRET: ${{ secrets.FIREBASE_TOKEN }}
      TELEGRAM_BOT_TOKEN_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase authentication
        shell: bash
        run: |
          set -e
          if [ -n "$FIREBASE_SA_PRIMARY" ]; then
            printf '%s' "$FIREBASE_SA_PRIMARY" > "$RUNNER_TEMP/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
            echo "Service account: $(jq -r '.client_email' "$RUNNER_TEMP/firebase-sa.json")"
          elif [ -n "$FIREBASE_SA_FALLBACK" ]; then
            printf '%s' "$FIREBASE_SA_FALLBACK" > "$RUNNER_TEMP/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
          elif [ -n "$FIREBASE_TOKEN_SECRET" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::Missing Firebase deployment credential."
            exit 1
          fi

      - name: Configure Telegram server environment
        shell: bash
        run: |
          set -e
          if [ -z "$TELEGRAM_BOT_TOKEN_SECRET" ]; then
            echo "::error::Missing TELEGRAM_BOT_TOKEN GitHub secret."
            exit 1
          fi
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN_SECRET" > functions/.env

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Deploy backend, Firestore rules and Storage rules
        run: firebase deploy --only functions,firestore:rules,storage --project "$PROJECT_ID" --non-interactive

      - name: Remove temporary function environment
        if: always()
        run: rm -f functions/.env
