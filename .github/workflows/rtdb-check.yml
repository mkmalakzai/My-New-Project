name: AFGlion RTDB Setup
on:
  push:
    branches: [afglion-rtdb-fix]
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: afglion-47b07
      FIREBASE_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFGLION_47B07 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFGLION_47B07 }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable Realtime Database API
        run: gcloud services enable firebasedatabase.googleapis.com --project "$PROJECT_ID"
      - run: npm install -g firebase-tools
      - name: Configure Firebase CLI auth
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SA_PRIMARY" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Initialize or list Realtime Database
        shell: bash
        run: |
          set -e
          if firebase database:instances:list --project "$PROJECT_ID" | grep -q "afglion-47b07"; then
            firebase database:instances:list --project "$PROJECT_ID"
          else
            printf '\n\n\n' | firebase init database --project "$PROJECT_ID"
            firebase database:instances:list --project "$PROJECT_ID"
          fi
