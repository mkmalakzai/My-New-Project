name: AFGlion RTDB Setup
on:
  push:
    branches: [afglion-rtdb-fix]
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: afglion-47b07
      PROJECT_NUMBER: "226343766461"
      DATABASE_ID: afglion-47b07-default-rtdb
      FIREBASE_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFGLION_47B07 }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFGLION_47B07 }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Enable Realtime Database API
        run: gcloud services enable firebasedatabase.googleapis.com --project "$PROJECT_ID"
      - name: Create default Realtime Database if missing
        shell: bash
        run: |
          set -e
          TOKEN="$(gcloud auth print-access-token)"
          LIST="$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasedatabase.googleapis.com/v1beta/projects/$PROJECT_ID/locations/-/instances")"
          if echo "$LIST" | grep -q "\"name\": \"projects/$PROJECT_NUMBER/locations/"; then
            echo "$LIST"
            exit 0
          fi
          HTTP_CODE="$(curl -sS -o /tmp/rtdb-create.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://firebasedatabase.googleapis.com/v1beta/projects/$PROJECT_ID/locations/asia-southeast1/instances?databaseId=$DATABASE_ID" \
            -d '{"type":"DEFAULT_DATABASE"}')"
          cat /tmp/rtdb-create.json
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "RTDB create failed with HTTP $HTTP_CODE"
            exit 1
          fi
          sleep 8
          curl -fsS -H "Authorization: Bearer $TOKEN" "https://firebasedatabase.googleapis.com/v1beta/projects/$PROJECT_ID/locations/-/instances"
