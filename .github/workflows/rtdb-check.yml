name: AFGlion RTDB Check
on:
  push:
    branches: [afglion-rtdb-fix]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: afglion-47b07
      FIREBASE_SA_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFGLION_47B07 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g firebase-tools
      - name: Configure Firebase auth
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SA_PRIMARY" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: List Realtime Database instances
        run: |
          firebase database:instances:list --project "$PROJECT_ID" || { cat firebase-debug.log || true; exit 1; }
